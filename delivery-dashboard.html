<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المندوب</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; display: inline-block; }
        .total-box { background: #e8f8f5; border: 1px solid #a3e4d7; padding: 15px; border-radius: 6px; margin: 15px 0; font-size: 16px; color: #16a085; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table, th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f2f2f2; }
        .btn-red { background: #c0392b; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; float: left; text-decoration: none; font-weight: bold; }
        select, input[type="text"] { padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
        button.action-btn { background: #27ae60; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="login.html" class="btn-red">تسجيل الخروج</a>
        <h2 id="deliveryTitle">لوحة تحكم المندوب - الشحنات المسندة</h2>
        <p>إدارة وتحديث حالات الشحنات المخصصة للمندوبين، مع عرض المبالغ المطلوب تحصيلها:</p>
        
        <div class="total-box">
            <span>إجمالي المبالغ المطلوبة تحصيلها:</span>
            <span id="totalAmountDisplay" style="font-size: 20px; color: #27ae60;">$0.00</span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>رقم الشحنة</th>
                    <th>اسم المندوب المسند له</th>
                    <th>اسم العميل والهاتف</th>
                    <th>المبلغ المطلوب تحصيله</th>
                    <th>الحالة والسبب</th>
                    <th>تحديث حالة التوصيل</th>
                </tr>
            </thead>
            <tbody id="delOrdersBody">
                <tr><td colspan="6">جاري التحميل...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const deliveryStatusOptions = `
            <option value="توزيع داخلي">توزيع داخلي</option>
            <option value="تم التسليم">تم التسليم</option>
            <option value="تم رفض الطلب أو عدم التسليم">تم رفض الطلب أو عدم التسليم</option>
        `;

        function loadDeliveryOrders() {
            let customers = JSON.parse(localStorage.getItem('adminCustomersList')) || [];
            let tbody = document.getElementById('delOrdersBody');
            tbody.innerHTML = '';

            let hasShipments = false;
            let totalSum = 0; 

            customers.forEach((cust, custIndex) => {
                if (cust.orders && cust.orders.length > 0) {
                    cust.orders.forEach((ord, ordIndex) => {
                        // عرض كل الطلبات التي تم إسناد مندوب لها من قبل الفرع
                        if (ord.assignedDelivery && ord.assignedDelivery.trim() !== "") {
                            hasShipments = true;

                            let rawPrice = ord.price ? parseFloat(ord.price.replace(/[^0-9.]/g, '')) || 0 : 0;
                            totalSum += rawPrice;

                            let reasonDisplay = ord.reason ? `<br><span style="color: #c0392b; font-size: 11px;">السبب: ${ord.reason}</span>` : '';
                            let currentOptionsHtml = deliveryStatusOptions.replace(`value="${ord.status}"`, `value="${ord.status}" selected`);

                            tbody.innerHTML += `
                                <tr>
                                    <td><b>${ord.id}</b></td>
                                    <td><span style="background: #eef2f3; padding: 3px 8px; border-radius: 4px; font-weight: bold; color: #2980b9;">${ord.assignedDelivery}</span></td>
                                    <td style="text-align: right;"><b>${cust.name}</b><br><span dir="ltr" style="font-size:12px; color:#666;">${cust.phone}</span></td>
                                    <td><b style="color: #e67e22; font-size: 15px;">${ord.price || '$0.00'}</b></td>
                                    <td><span style="padding: 3px 8px; background: #e2f0d9; border-radius: 4px; font-weight: bold; font-size: 12px;">${ord.status}</span>${reasonDisplay}</td>
                                    <td>
                                        <select id="del_status_${custIndex}_${ordIndex}" onchange="checkDelReason(${custIndex}, ${ordIndex})">
                                            ${currentOptionsHtml}
                                        </select>
                                        <input type="text" id="del_reason_${custIndex}_${ordIndex}" placeholder="سبب عدم التسليم..." style="display: ${ord.status === 'تم رفض الطلب أو عدم التسليم' ? 'block' : 'none'}; margin-top: 5px; width: 100%;" value="${ord.reason || ''}">
                                        <button class="action-btn" onclick="updateDeliveryStatus(${custIndex}, ${ordIndex})" style="margin-top: 5px;">تحديث</button>
                                    </td>
                                </tr>
                            `;
                        }
                    });
                }
            });

            document.getElementById('totalAmountDisplay`').innerText = `$${totalSum.toFixed(2)}`;

            if (!hasShipments) {
                tbody.innerHTML = `<tr><td colspan="6">لا توجد أي شحنات مسندة للمندوبين حتى الآن من الفروع</td></tr>`;
                document.getElementById('totalAmountDisplay').innerText = '$0.00';
            }
        }

        function checkDelReason(custIndex, ordIndex) {
            let status = document.getElementById(`del_status_${custIndex}_${ordIndex}`).value;
            let reasonInput = document.getElementById(`del_reason_${custIndex}_${ordIndex}`);
            if (status === 'تم رفض الطلب أو عدم التسليم') {
                reasonInput.style.display = 'block';
            } else {
                reasonInput.style.display = 'none';
                reasonInput.value = '';
            }
        }

        function updateDeliveryStatus(custIndex, ordIndex) {
            let newStatus = document.getElementById(`del_status_${custIndex}_${ordIndex}`).value;
            let reason = document.getElementById(`del_reason_${custIndex}_${ordIndex}`).value;

            let customers = JSON.parse(localStorage.getItem('adminCustomersList')) || [];
            if (customers[custIndex] && customers[custIndex].orders[ordIndex]) {
                customers[custIndex].orders[ordIndex].status = newStatus;
                customers[custIndex].orders[ordIndex].reason = (newStatus === 'تم رفض الطلب أو عدم التسليم') ? reason : '';
                
                localStorage.setItem('adminCustomersList', JSON.stringify(customers));
                alert('تم تحديث حالة الشحنة بنجاح');
                loadDeliveryOrders();
            }
        }

        window.onload = function() {
            loadDeliveryOrders();
        }
    </script>
</body>
</html>
