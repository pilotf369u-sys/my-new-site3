<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الموظف الاحترافية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; display: inline-block; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table, th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f2f2f2; font-size: 14px; }
        .btn-red { background: #c0392b; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; float: left; text-decoration: none; font-weight: bold; }
        select, input[type="text"] { padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
        .action-bar { background: #eef2f3; padding: 12px; border-radius: 6px; margin-top: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        button.action-btn { background: #27ae60; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button.btn-blue { background: #2980b9; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="login.html" class="btn-red">تسجيل الخروج</a>
        <h2>لوحة تحكم الموظف - إدارة الطلبات</h2>
        <p>متابعة الطلبات، إسنادها للمندوبين، وتحديث حالتها فردياً أو جماعياً.</p>

        <!-- شريط التحديث الجماعي -->
        <div class="action-bar">
            <span><b>الإجراء الجماعي للطلبات المحددة:</b></span>
            <select id="bulkStatusSelect" onchange="checkBulkReason()">
                <option value="" disabled selected>اختر الحالة الجماعية...</option>
                <option value="انتظار الدفع">انتظار الدفع</option>
                <option value="قيد المعالجة">قيد المعالجة</option>
                <option value="تم الطلب">تم الطلب</option>
                <option value="جاهز للشحن">جاهز للشحن</option>
                <option value="تم الشحن">تم الشحن</option>
                <option value="مخزن محلي">مخزن محلي</option>
                <option value="توزيع داخلي">توزيع داخلي</option>
                <option value="تم التسليم">تم التسليم</option>
                <option value="تم رفض الطلب أو عدم التسليم">تم رفض الطلب أو عدم التسليم</option>
            </select>
            <input type="text" id="bulkReasonInput" placeholder="أدخل سبب الرفض أو عدم التسليم..." style="display: none; flex: 1; min-width: 200px;">
            <button class="btn-blue" onclick="applyBulkUpdate()">تطبيق على المختار</button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"> تحديد الكل</th>
                    <th>رقم الطلب</th>
                    <th>العميل ورقم الهاتف</th>
                    <th>التفاصيل والمبلغ</th>
                    <th>الحالة الحالية والسبب</th>
                    <th>إسناد لمندوب</th>
                    <th>تحديث الحالة الفردية</th>
                </tr>
            </thead>
            <tbody id="empOrdersBody">
                <tr><td colspan="7">جاري تحميل الطلبات...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const statusListOptions = `
            <option value="انتظار الدفع">انتظار الدفع</option>
            <option value="قيد المعالجة">قيد المعالجة</option>
            <option value="تم الطلب">تم الطلب</option>
            <option value="جاهز للشحن">جاهز للشحن</option>
            <option value="تم الشحن">تم الشحن</option>
            <option value="مخزن محلي">مخزن محلي</option>
            <option value="توزيع داخلي">توزيع داخلي</option>
            <option value="تم التسليم">تم التسليم</option>
            <option value="تم رفض الطلب أو عدم التسليم">تم رفض الطلب أو عدم التسليم</option>
        `;

        // دتهيئة البيانات الافتراضية للعملاء والطلبات والمندوبين إذا لم تكن موجودة
        function initDefaultData() {
            if (!localStorage.getItem('deliveryList')) {
                const defaultDelivery = [
                    { name: "محمد أحمد", phone: "05311111111", password: "123" },
                    { name: "خالد محمود", phone: "05322222222", password: "123" }
                ];
                localStorage.setItem('deliveryList', JSON.stringify(defaultDelivery));
            }

            if (!localStorage.getItem('adminCustomersList')) {
                const defaultCustomers = [
                    { 
                        code: "CUS-9014",
                        name: "عمر الجماس", 
                        phone: "905378240430", 
                        password: "123",
                        country: "تركيا",
                        state: "إسطنبول",
                        address: "إسطنبول، الفاتح، شارع الأنس",
                        orders: [
                            { id: "#MW-9014", status: "توزيع داخلي", price: "$85.50", assignedDelivery: "محمد أحمد", reason: "" },
                            { id: "#MW-8821", status: "قيد المعالجة", price: "$120.00", assignedDelivery: "", reason: "" }
                        ]
                    },
                    { 
                        code: "CUS-5520",
                        name: "عبد العزيز", 
                        phone: "9647772279773", 
                        password: "123",
                        country: "العراق",
                        state: "بغداد",
                        address: "بغداد، حي المنصور",
                        orders: [
                            { id: "#MW-5520", status: "جاهز للشحن", price: "$200.00", assignedDelivery: "خالد محمود", reason: "" }
                        ]
                    }
                ];
                localStorage.setItem('adminCustomersList', JSON.stringify(defaultCustomers));
            }
        }

        function loadEmployeeOrders() {
            let customers = JSON.parse(localStorage.getItem('adminCustomersList')) || [];
            let deliveryList = JSON.parse(localStorage.getItem('deliveryList')) || [];
            let tbody = document.getElementById('empOrdersBody');
            tbody.innerHTML = '';

            let hasOrders = false;

            customers.forEach((cust, custIndex) => {
                if (cust.orders && cust.orders.length > 0) {
                    cust.orders.forEach((ord, ordIndex) => {
                        hasOrders = true;

                        // تعبئة قائمة المندوبين من النظام المسجل
                        let deliveryOptions = `<option value="">اختر المندوب</option>`;
                        deliveryList.forEach(del => {
                            let selected = (ord.assignedDelivery === del.name) ? 'selected' : '';
                            deliveryOptions += `<option value="${del.name}" ${selected}>${del.name}</option>`;
                        });

                        let reasonDisplay = ord.reason ? `<br><span style="color: #c0392b; font-size: 11px;">السبب: ${ord.reason}</span>` : '';

                        // توليد خيارات الحالات مع تحديد الحالة الحالية
                        let currentOptionsHtml = statusListOptions.replace(`value="${ord.status}"`, `value="${ord.status}" selected`);

                        tbody.innerHTML += `
                            <tr>
                                <td><input type="checkbox" class="order-checkbox" data-cust="${custIndex}" data-ord="${ordIndex}"></td>
                                <td><b>${ord.id}</b></td>
                                <td style="text-align: right;"><b>${cust.name}</b><br><span style="font-size: 12px; color: #666;" dir="ltr">${cust.phone}</span></td>
                                <td><b style="color: #2980b9;">${ord.price || '$0.00'}</b></td>
                                <td><span style="padding: 3px 8px; background: #fff3cd; border-radius: 4px; font-weight: bold; font-size: 12px;">${ord.status}</span>${reasonDisplay}</td>
                                <td>
                                    <select id="del_${custIndex}_${ordIndex}" onchange="assignDelivery(${custIndex}, ${ordIndex})">
                                        ${deliveryOptions}
                                    </select>
                                </td>
                                <td>
                                    <select id="status_${custIndex}_${ordIndex}" onchange="checkIndividualReason(${custIndex}, ${ordIndex})">
                                        ${currentOptionsHtml}
                                    </select>
                                    <input type="text" id="reason_${custIndex}_${ordIndex}" placeholder="سبب الرفض/عدم التسليم" style="display: ${ord.status === 'تم رفض الطلب أو عدم التسليم' ? 'block' : 'none'}; margin-top: 5px; width: 100%;" value="${ord.reason || ''}">
                                    <button class="action-btn" onclick="updateOrderStatus(${custIndex}, ${ordIndex})" style="margin-top: 5px;">حفظ</button>
                                </td>
                            </tr>
                        `;
                    });
                }
            });

            if (!hasOrders) {
                tbody.innerHTML = `<tr><td colspan="7">لا توجد طلبات واردة حالياً</td></tr>`;
            }
        }

        function toggleSelectAll(source) {
            let checkboxes = document.querySelectorAll('.order-checkbox');
            checkboxes.forEach(cb => cb.checked = source.checked);
        }

        function checkBulkReason() {
            let status = document.getElementById('bulkStatusSelect').value;
            let reasonInput = document.getElementById('bulkReasonInput');
            if (status === 'تم رفض الطلب أو عدم التسليم') {
                reasonInput.style.display = 'inline-block';
            } else {
                reasonInput.style.display = 'none';
                reasonInput.value = '';
            }
        }

        function checkIndividualReason(custIndex, ordIndex) {
            let status = document.getElementById(`status_${custIndex}_${ordIndex}`).value;
            let reasonInput = document.getElementById(`reason_${custIndex}_${ordIndex}`);
            if (status === 'تم رفض الطلب أو عدم التسليم') {
                reasonInput.style.display = 'block';
            } else {
                reasonInput.style.display = 'none';
                reasonInput.value = '';
            }
        }

        function assignDelivery(custIndex, ordIndex) {
            let selectedDelivery = document.getElementById(`del_${custIndex}_${ordIndex}`).value;
            let customers = JSON.parse(localStorage.getItem('adminCustomersList')) || [];
            customers[custIndex].orders[ordIndex].assignedDelivery = selectedDelivery;
            localStorage.setItem('adminCustomersList', JSON.stringify(customers));
        }

        function updateOrderStatus(custIndex, ordIndex) {
            let newStatus = document.getElementById(`status_${custIndex}_${ordIndex}`).value;
            let reason = document.getElementById(`reason_${custIndex}_${ordIndex}`).value;

            let customers = JSON.parse(localStorage.getItem('adminCustomersList')) || [];
            customers[custIndex].orders[ordIndex].status = newStatus;
            customers[custIndex].orders[ordIndex].reason = (newStatus === 'تم رفض الطلب أو عدم التسليم') ? reason : '';
            
            localStorage.setItem('adminCustomersList', JSON.stringify(customers));
            alert('تم تحديث حالة الطلب بنجاح');
            loadEmployeeOrders();
        }

        function applyBulkUpdate() {
            let selectedStatus = document.getElementById('bulkStatusSelect').value;
            let bulkReason = document.getElementById('bulkReasonInput').value;

            if (!selectedStatus) {
                alert('الرجاء اختيار الحالة المراد تطبيقها أولاً');
                return;
            }

            let checkboxes = document.querySelectorAll('.order-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('الرجاء تحديد طلب واحد على الأقل من الجدول');
                return;
            }

            let customers = JSON.parse(localStorage.getItem('adminCustomersList')) || [];

            checkboxes.forEach(cb => {
                let cIdx = cb.getAttribute('data-cust');
                let oIdx = cb.getAttribute('data-ord');
                customers[cIdx].orders[oIdx].status = selectedStatus;
                customers[cIdx].orders[oIdx].reason = (selectedStatus === 'تم رفض الطلب أو عدم التسليم') ? bulkReason : '';
            });

            localStorage.setItem('adminCustomersList', JSON.stringify(customers));
            alert('تم تطبيق التحديث الجماعي بنجاح');
            loadEmployeeOrders();
        }

        window.onload = function() {
            initDefaultData();
            loadEmployeeOrders();
        }
    </script>
</body>
</html>
