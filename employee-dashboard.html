<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الموظف</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table, th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f2f2f2; }
        .btn-red { background: #c0392b; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; float: left; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="login.html" class="btn-red">تسجيل الخروج</a>
        <h2>مرحباً بك عزيزي الموظف</h2>
        <p>من هذه اللوحة يمكنك متابعة الطلبات والمهام المسندة إليك.</p>
        
        <h3>الطلبات الواردة</h3>
        <table>
            <thead>
                <tr>
                    <th>رقم الطلب</th>
                    <th>اسم العميل</th>
                    <th>الحالة</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody id="empOrdersBody">
                <tr><td colspan="4">لا توجد طلبات حالياً</td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
