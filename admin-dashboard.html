<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .sidebar { width: 250px; background: #2c3e50; color: white; position: fixed; height: 100%; padding: 20px; }
        .sidebar h2 { font-size: 20px; text-align: center; margin-bottom: 30px; }
        .sidebar a { display: block; color: white; text-decoration: none; padding: 12px; margin-bottom: 10px; border-radius: 5px; background: #34495e; transition: 0.3s; }
        .sidebar a:hover { background: #1abc9c; }
        .main-content { margin-right: 270px; padding: 30px; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; }
    </style>
</head>
<body>

    <!-- القائمة الجانبية للأدمن -->
    <div class="sidebar">
        <h2>لوحة الإدارة</h2>
        <a href="#orders">إدارة الطلبات</a>
        <a href="#employees">إدارة الموظفين</a>
        <a href="#content">إدارة الصفحة والموقع</a>
        <a href="#customers">إدارة العملاء</a>
        <a href="index.html" style="background: #c0392b; margin-top: 50px;">تسجيل الخروج</a>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <h1>مرحباً بك يا أدمن</h1>
        
        <div class="card" id="orders">
            <h3>إدارة الطلبات</h3>
            <p>هنا سظهر جدول الطلبات الخاصة بالعملاء مع إمكانية تعديل حالتها.</p>
        </div>

        <div class="card" id="employees">
            <h3>إدارة الموظفين</h3>
            <p><button style="background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer;">+ إضافة موظف جديد</button></p>
        </div>

        <div class="card" id="content">
            <h3>إدارة المحتوى</h3>
            <p>تعديل نصوص وأقسام الموقع الرئيسية.</p>
        </div>
    </div>

</body>
</html>
