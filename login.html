<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - MeshWar</title>
    <!-- هنا سنربط قاعدة البيانات الخاصة بنا -->
    <script src="customers_db.js"></script>
    <style>
        /* نفس تنسيقاتك الجميلة السابقة */
        body { font-family: sans-serif; background: #f4f6f9; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { background: white; padding: 30px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #cc0000; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="phone" placeholder="رقم الهاتف">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <p style="text-align: center; margin-top: 15px;">
        <a href="register.html">ليس لديك حساب؟ سجل الآن</a>
    </p>
</div>

<script>
   function login() {
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;

        // البحث في ملف customers_db.js
        const user = customersDB.find(c => c.phone === phone && c.password === password);

        if (user) {
            // حفظ بيانات المستخدم كاملة في المتصفح لاستخدامها في الداشبورد
            localStorage.setItem('loggedInUser', JSON.stringify(user));
            
            // تحويل المستخدم إلى لوحة التحكم الخاصة به
            window.location.href = 'dashboard.html'; 
        } else {
            alert('رقم الهاتف أو كلمة المرور غير صحيحة.');
        }
   }
</script>
</body>
</html>
